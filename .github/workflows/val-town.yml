name: Check and deploy bot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: val-town-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Update existing Val Town HTTP file
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$VAL_TOWN_API_KEY"
          jq -n --rawfile content main.ts '{content: $content}' > "$RUNNER_TEMP/val-file.json"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $VAL_TOWN_API_KEY" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/val-file.json" \
            'https://api.val.town/v2/vals/576d6efe-b3c5-44bc-a34f-53db098e6e40/files?path=main.ts' \
            > "$RUNNER_TEMP/update-response.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VAL_TOWN_API_KEY" \
            'https://api.val.town/v2/vals/576d6efe-b3c5-44bc-a34f-53db098e6e40/files/content?path=main.ts' \
            > "$RUNNER_TEMP/deployed-main.ts"
          cmp main.ts "$RUNNER_TEMP/deployed-main.ts"
          curl --fail-with-body --silent --show-error \
            'https://brywhit--ef6e84f0c82a11f19f531607ee4eb77e.web.val.run/health' \
            | jq -e '.ok == true'
